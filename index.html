<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl shadow w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Calorie Counter</h1>

        <!-- FORM -->
        <form id="foodForm" class="space-y-3">
            <input type="text" id="foodName" placeholder="Food name"
                class="w-full border p-2 rounded" required>

            <input type="number" id="calories" placeholder="Calories"
                class="w-full border p-2 rounded" required>

            <button class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600">
                Add Food
            </button>
        </form>

        <!-- TOTAL -->
        <div class="mt-4 text-lg font-semibold">
            Total Calories: <span id="total">0</span>
        </div>

        <!-- LIST -->
        <ul id="foodList" class="mt-4 space-y-2"></ul>

        <!-- RESET -->
        <button id="resetBtn"
            class="mt-4 w-full bg-red-500 text-white py-2 rounded hover:bg-red-600">
            Reset Day
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
